<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AzureDevOps++ settings</title>
    <style>
      :root { color-scheme: light dark; font-family: "Segoe UI", system-ui, sans-serif; background: Canvas; color: CanvasText; }
      * { box-sizing: border-box; } body { margin: 0; } #app { width: min(820px, calc(100% - 36px)); margin: 46px auto; }
      .page-header { display: flex; justify-content: space-between; gap: 28px; align-items: start; padding-bottom: 22px; border-bottom: 1px solid color-mix(in srgb, CanvasText 18%, transparent); }
      .eyebrow { margin: 0 0 5px; color: #0078d4; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; }
      h1 { margin: 0; font-size: 28px; letter-spacing: -.025em; } .page-header p:last-child { max-width: 600px; margin: 8px 0 0; color: GrayText; }
      .master { display: flex; gap: 9px; align-items: center; padding: 9px 11px; white-space: nowrap; border: 1px solid color-mix(in srgb, CanvasText 24%, transparent); border-radius: 4px; font-weight: 650; }
      input[type="checkbox"] { width: 17px; height: 17px; accent-color: #0078d4; }
      .search-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; margin: 22px 0; } input[type="search"], select { padding: 9px 10px; color: CanvasText; background: Canvas; border: 1px solid color-mix(in srgb, CanvasText 26%, transparent); border-radius: 3px; font: inherit; }
      section { margin: 28px 0; } h2 { margin: 0 0 10px; font-size: 16px; } .setting-list { border: 1px solid color-mix(in srgb, CanvasText 18%, transparent); border-radius: 4px; overflow: hidden; }
      .setting { display: grid; grid-template-columns: 1fr auto; gap: 18px; align-items: center; padding: 14px 15px; border-bottom: 1px solid color-mix(in srgb, CanvasText 12%, transparent); } .setting:last-child { border-bottom: 0; }
      .setting strong { display: block; } .setting small { display: block; margin-top: 3px; color: GrayText; line-height: 1.4; } .setting b { color: #986f0b; font-weight: 600; }
      footer { display: flex; justify-content: space-between; align-items: center; gap: 14px; padding-top: 18px; border-top: 1px solid color-mix(in srgb, CanvasText 18%, transparent); } button { padding: 8px 11px; border: 1px solid color-mix(in srgb, CanvasText 26%, transparent); border-radius: 3px; color: CanvasText; background: Canvas; font: 600 14px "Segoe UI", sans-serif; cursor: pointer; }
      button:focus-visible,input:focus-visible,select:focus-visible { outline: 2px solid #0078d4; outline-offset: 2px; } output,.empty { color: GrayText; }
      @media (max-width: 620px) { .page-header { display: grid; } .master { justify-self: start; } .search-row { grid-template-columns: 1fr; } }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./options.js"></script>
  </body>
</html>
